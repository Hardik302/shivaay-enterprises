html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 16px/1.7 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;

h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.08;margin:0;letter-spacing:-.01em}
a{color:inherit}
header{background:none;border:0}
.top{max-width:1080px;margin:auto;padding:22px 22px 10px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand b{font:600 30px "Cormorant Garamond",Georgia,serif;letter-spacing:.14em;color:var(--gold);display:block;line-height:1}
.brand span{font-size:12.5px;color:var(--mute);letter-spacing:.04em}
.wa{color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:999px;border:1px solid rgba(166,124,31,.55);background:rgba(166,124,31,.08);white-space:nowrap}
.wa:hover{background:var(--gold);color:#fff}
nav{position:sticky;top:0;z-index:5;overflow-x:auto;scrollbar-width:none;padding:8px 0;background:linear-gradient(var(--bg) 60%,transparent)}
nav::-webkit-scrollbar{display:none}
nav div{display:flex;gap:2px;margin:0 auto;width:max-content;min-width:min(100%,1036px);padding:5px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);box-shadow:0 4px 18px rgba(60,40,0,.06)}
nav button{font:600 13.5px "Plus Jakarta Sans",sans-serif;border:0;background:none;color:var(--mute);padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button[aria-selected=true]{background:var(--ink);color:#fff}
nav button:focus-visible,a:focus-visible,.tile:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
main{max-width:1080px;margin:auto;padding:26px 22px 60px}
section[hidden]{display:none}
.hero{padding:56px 0 46px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(46px,9vw,104px);font-weight:500;max-width:11ch;line-height:.95}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p{max-width:52ch;color:var(--mute);font-size:18px;margin:26px 0 8px}
.btn{display:inline-block;background:var(--ink);color:#fff;font-weight:700;font-size:15px;text-decoration:none;padding:13px 26px;border-radius:999px;margin:12px 10px 0 0;border:1px solid var(--ink);cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.alt:hover{border-color:var(--gold)}
h2{font-size:clamp(32px,5vw,46px);margin:64px 0 22px;color:var(--ink);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:block;position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 24px 24px;backdrop-filter:blur(8px);transition:transform .2s,border-color .2s}
.tile:before{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:var(--c);opacity:.13;filter:blur(30px);transition:opacity .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--c)}
.tile:hover:before{opacity:.3}
.tile .n{font:500 44px/1 "Cormorant Garamond",serif;color:var(--c);display:block;margin-bottom:34px;min-width:0;background:none;padding:0;text-align:left}
.tile h3{font-size:28px;margin:0 0 6px;color:var(--ink)}
.tile p{margin:0;color:var(--mute);font-size:14px}
.tile span[aria-hidden]{position:absolute;right:22px;top:24px;font-size:24px;filter:grayscale(.2)}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;border-top:1px solid var(--line)}
.trust div{padding:22px 22px 8px 0;border-bottom:1px solid var(--line)}
.trust b{display:block;font:500 26px "Cormorant Garamond",serif;color:var(--gold)}
.trust span{color:var(--mute);font-size:14.5px}
.ph{background:none;color:var(--ink);padding:44px 0 34px;border-bottom:1px solid var(--line);position:relative}
.ph:after{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:3px;background:var(--c)}
.ph h1{font-size:clamp(44px,8vw,88px);font-weight:500;margin-top:6px}
.ph p{margin:14px 0 0;font-size:18px;color:var(--mute);max-width:56ch}
.pb{background:none;border:0;padding:30px 0 0}

.pb li{padding:16px 0 16px 34px;position:relative;border-bottom:1px solid var(--line);font-size:17px}

.pb .more{margin-top:20px;color:var(--mute);font-size:14.5px}
.contact{border:1px solid var(--line);background:var(--card);border-radius:24px;padding:30px;display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));backdrop-filter:blur(8px)}

.contact a:not(.btn){text-decoration:none;font-size:22px}
footer{border-top:1px solid var(--line);color:var(--mute);text-align:center;padding:28px 22px;font-size:13.5px;background:none}
footer b{color:var(--gold);font-weight:600}

.ph{border-radius:28px;padding:54px 36px 44px;margin-top:6px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 28%,transparent);background:linear-gradient(115deg,color-mix(in srgb,var(--c) 18%,#fff),color-mix(in srgb,var(--c) 6%,#fff) 65%,#fff)}

.wm{position:fixed;right:-40px;bottom:-30px;width:min(75vw,680px);color:var(--c);opacity:.07;pointer-events:none;z-index:0}
.pb{position:relative;z-index:1}
